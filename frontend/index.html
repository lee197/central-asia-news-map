<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中亚新闻地图</title>
<style>
  :root {
    --bg-deep: #0F1620;
    --surface: #1A2332;
    --surface-hover: #1F2A3E;
    --surface-active: #243248;
    --border: #2A3548;
    --text-primary: #E8EEF5;
    --text-secondary: #8B99AD;
    --text-tertiary: #5A6779;
    --accent: #3B9EFF;
    --accent-hover: #5BB0FF;
    --sand: #E8B568;
    --color-kz: #3B9EFF;
    --color-uz: #E8B568;
    --color-kg: #EF6B6B;
    --color-tj: #A78BFA;
    --color-tm: #4ADE80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    overflow: hidden;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    background: rgba(26, 35, 50, 0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 24px;
    z-index: 100;
  }
  .logo {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin-right: 24px;
  }
  .logo-emoji { margin-right: 6px; }
  .update-info {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .topbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .country-filter {
    display: flex;
    gap: 4px;
    background: var(--bg-deep);
    border-radius: 8px;
    padding: 3px;
    border: 1px solid var(--border);
  }
  .country-chip {
    padding: 5px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .country-chip:hover { color: var(--text-primary); }
  .country-chip.active {
    background: var(--surface-active);
    color: var(--text-primary);
  }
  .about-link {
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.15s;
  }
  .about-link:hover { color: var(--text-primary); }

  /* ===== 主体布局 ===== */
  .layout {
    display: flex;
    height: 100vh;
    padding-top: 56px;
  }
  .map-container {
    flex: 1;
    position: relative;
    background: var(--bg-deep);
  }
  #map {
    width: 100%;
    height: 100%;
  }

  /* ===== 右侧列表 ===== */
  .news-panel {
    width: 360px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .news-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .news-header-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
  }
  .news-header-count {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .news-list {
    flex: 1;
    overflow-y: auto;
  }
  .news-list::-webkit-scrollbar { width: 6px; }
  .news-list::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  .news-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.12s;
    border-left: 3px solid transparent;
  }
  .news-item:hover {
    background: var(--surface-hover);
  }
  .news-item.active {
    background: var(--surface-active);
    border-left-color: var(--sand);
  }
  .news-item-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 11px;
  }
  .country-badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 500;
    font-size: 11px;
  }
  .country-badge.kz { background: rgba(59,158,255,0.15); color: var(--color-kz); }
  .country-badge.uz { background: rgba(232,181,104,0.15); color: var(--color-uz); }
  .country-badge.kg { background: rgba(239,107,107,0.15); color: var(--color-kg); }
  .country-badge.tj { background: rgba(167,139,250,0.15); color: var(--color-tj); }
  .country-badge.tm { background: rgba(74,222,128,0.15); color: var(--color-tm); }
  .perspective-badge {
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 500;
    font-size: 11px;
    border: 1px solid transparent;
  }
  .perspective-badge.local {
    background: rgba(139,153,173,0.12);
    color: var(--text-secondary);
    border-color: rgba(139,153,173,0.25);
  }
  .perspective-badge.western {
    background: rgba(232,238,245,0.08);
    color: var(--text-primary);
    border-color: rgba(232,238,245,0.4);
  }
  .news-item-time {
    color: var(--text-tertiary);
  }
  .news-item-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .news-item-city {
    font-size: 11px;
    color: var(--text-secondary);
  }

  /* ===== 弹窗 (InfoWindow 自定义) ===== */
  .info-card {
    width: 320px;
    background: var(--surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    overflow: hidden;
    color: var(--text-primary);
    font-family: inherit;
  }
  .info-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .info-card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .info-card-body {
    padding: 14px 16px;
  }
  .info-card-title {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.45;
    margin-bottom: 10px;
  }
  .info-card-summary {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 12px;
  }
  .info-card-source {
    font-size: 11px;
    color: var(--text-tertiary);
    margin-bottom: 14px;
  }
  .btn-primary {
    display: block;
    width: 100%;
    padding: 9px 0;
    text-align: center;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary:hover { background: var(--accent-hover); }

  /* ===== 加载状态 ===== */
  .loading-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: rgba(15, 22, 32, 0.6);
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 50;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-size: 13px;
    color: var(--text-secondary);
  }

  /* 骨架屏 */
  .skeleton-item {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .skeleton-line {
    height: 10px;
    background: linear-gradient(90deg, var(--border), var(--surface-hover), var(--border));
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
    margin-bottom: 8px;
  }
  .skeleton-line.w-60 { width: 60%; }
  .skeleton-line.w-90 { width: 90%; }
  .skeleton-line.w-40 { width: 40%; }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  /* ===== 关于弹层 ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
    z-index: 9000;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    width: 420px;
    max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .modal-head {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-head h2 { font-size: 15px; font-weight: 600; }
  .modal-close {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-body { padding: 20px; }
  .modal-body p {
    color: var(--text-secondary);
    margin-bottom: 12px;
    font-size: 13px;
    line-height: 1.7;
  }
  .modal-body .meta-line {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-tertiary);
  }

  /* 高德默认 InfoWindow 样式覆盖 */
  .amap-info-content {
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
  }
  .amap-info-close { display: none !important; }
  .amap-info-sharp { display: none !important; }
</style>
</head>
<body>

<!-- 顶部栏 -->
<header class="topbar">
  <div class="logo"><span class="logo-emoji">🌍</span>中亚新闻地图</div>
  <div class="update-info" id="updateInfo">🔄 更新于刚刚</div>
  <div class="topbar-right">
    <div class="country-filter" id="perspectiveFilter">
      <div class="country-chip active" data-perspective="ALL">全部视角</div>
      <div class="country-chip" data-perspective="local">当地</div>
      <div class="country-chip" data-perspective="western">欧美</div>
    </div>
    <div class="country-filter" id="countryFilter">
      <div class="country-chip active" data-country="ALL">全部</div>
      <div class="country-chip" data-country="KZ">KZ</div>
      <div class="country-chip" data-country="UZ">UZ</div>
      <div class="country-chip" data-country="KG">KG</div>
      <div class="country-chip" data-country="TJ">TJ</div>
      <div class="country-chip" data-country="TM">TM</div>
    </div>
    <div class="about-link" id="aboutBtn">关于</div>
  </div>
</header>

<!-- 主体 -->
<div class="layout">
  <div class="map-container">
    <div id="map"></div>
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">正在加载新闻…</div>
    </div>
  </div>
  <aside class="news-panel">
    <div class="news-header">
      <div class="news-header-title">最新新闻</div>
      <div class="news-header-count" id="newsCount">载入中…</div>
    </div>
    <div class="news-list" id="newsList">
      <!-- 骨架屏 -->
      <div class="skeleton-item">
        <div class="skeleton-line w-40"></div>
        <div class="skeleton-line w-90"></div>
        <div class="skeleton-line w-60"></div>
      </div>
      <div class="skeleton-item">
        <div class="skeleton-line w-40"></div>
        <div class="skeleton-line w-90"></div>
        <div class="skeleton-line w-60"></div>
      </div>
      <div class="skeleton-item">
        <div class="skeleton-line w-40"></div>
        <div class="skeleton-line w-90"></div>
        <div class="skeleton-line w-60"></div>
      </div>
    </div>
  </aside>
</div>

<!-- 关于弹层 -->
<div class="modal-mask" id="aboutModal">
  <div class="modal">
    <div class="modal-head">
      <h2>关于本站</h2>
      <button class="modal-close" id="aboutClose">×</button>
    </div>
    <div class="modal-body">
      <p>中亚新闻地图聚合中亚五国（哈萨克斯坦、乌兹别克斯坦、吉尔吉斯斯坦、塔吉克斯坦、土库曼斯坦）的最新新闻，按发生地点呈现于地图上。</p>
      <p>所有内容由 AI 自动翻译为中文。点击地图上的圆点可查看新闻摘要，点击"查看原文"跳转到原始新闻。</p>
      <div class="meta-line">
        数据源：GDELT + 区域媒体 RSS<br>
        地图：高德地图<br>
        翻译：Claude AI<br>
        本页为 MVP 原型，使用模拟数据。
      </div>
    </div>
  </div>
</div>

<!-- 配置：会被构建脚本注入实际值 -->
<script>
  window.APP_CONFIG = {
    AMAP_KEY: '__AMAP_KEY__',
    API_BASE: '__API_BASE__'
  };
</script>
<script>
  // 动态加载高德地图主库
  (function() {
    var s = document.createElement('script');
    s.src = 'https://webapi.amap.com/maps?v=2.0&key=' + window.APP_CONFIG.AMAP_KEY;
    document.head.appendChild(s);
  })();
</script>
<script>
  // 真实数据从后端拉取
  let NEWS_DATA = [];

  const COUNTRY_NAMES = { KZ: '哈萨克斯坦', UZ: '乌兹别克斯坦', KG: '吉尔吉斯斯坦', TJ: '塔吉克斯坦', TM: '土库曼斯坦' };
  const COUNTRY_COLORS = { KZ: '#3B9EFF', UZ: '#E8B568', KG: '#EF6B6B', TJ: '#A78BFA', TM: '#4ADE80' };

  let map, infoWindow;
  let clusterer = null;   // 高德 MarkerCluster 实例
  const markerMap = {};   // id -> marker
  let currentFilter = 'ALL';
  let currentPerspective = 'ALL';
  let activeId = null;

  const PERSPECTIVE_LABEL = { local: '当地', western: '欧美' };

  // ====== 工具函数 ======
  function timeAgo(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff / 60) + ' 分钟前';
    if (diff < 86400) return Math.floor(diff / 3600) + ' 小时前';
    return Math.floor(diff / 86400) + ' 天前';
  }

  function makeMarkerContent(country, perspective) {
    const color = COUNTRY_COLORS[country] || '#3B9EFF';
    if (perspective === 'western') {
      // 欧美视角：内圆 + 白色外环 + 同色光晕，跟当地视角明显区分
      return `<div style="
        width: 18px; height: 18px;
        background: ${color};
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow: 0 0 0 2px ${color}80, 0 2px 6px rgba(0,0,0,0.6);
        cursor: pointer;
        transition: transform 0.15s;
      "></div>`;
    }
    return `<div style="
      width: 14px; height: 14px;
      background: ${color};
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: transform 0.15s;
    "></div>`;
  }

  function makeInfoCard(news) {
    const country = news.country.toLowerCase();
    const persp = news.perspective || 'local';
    const perspLabel = PERSPECTIVE_LABEL[persp] || persp;
    return `
      <div class="info-card">
        <div class="info-card-head">
          <div class="info-card-meta">
            <span class="country-badge ${country}">${news.country}</span>
            <span class="perspective-badge ${persp}">${perspLabel}视角</span>
            <span>${timeAgo(news.published_at)}</span>
          </div>
        </div>
        <div class="info-card-body">
          <div class="info-card-title">${news.title_zh}</div>
          <div class="info-card-summary">${news.summary_zh}</div>
          <div class="info-card-source">📍 ${news.city} · 来源：${news.source}</div>
          <a href="${news.source_url}" target="_blank" rel="noopener" class="btn-primary">查看原文 →</a>
        </div>
      </div>
    `;
  }

  // ====== 渲染 ======
  function renderList(items) {
    const list = document.getElementById('newsList');
    document.getElementById('newsCount').textContent = `(${items.length})`;
    if (items.length === 0) {
      list.innerHTML = `
        <div style="padding: 60px 20px; text-align: center; color: var(--text-secondary);">
          <div style="font-size: 32px; margin-bottom: 12px;">📭</div>
          <div style="font-size: 13px;">该地区最近暂无新闻</div>
        </div>`;
      return;
    }
    list.innerHTML = items.map(n => {
      const persp = n.perspective || 'local';
      const perspLabel = PERSPECTIVE_LABEL[persp] || persp;
      return `
      <div class="news-item ${n.id === activeId ? 'active' : ''}" data-id="${n.id}">
        <div class="news-item-meta">
          <span class="country-badge ${n.country.toLowerCase()}">${n.country}</span>
          <span class="perspective-badge ${persp}">${perspLabel}</span>
          <span class="news-item-time">${timeAgo(n.published_at)}</span>
        </div>
        <div class="news-item-title">${n.title_zh}</div>
        <div class="news-item-city">${n.city}</div>
      </div>
      `;
    }).join('');
    list.querySelectorAll('.news-item').forEach(el => {
      el.addEventListener('click', () => focusNews(el.dataset.id));
    });
  }

  function makeClusterContent(count, dominantCountry) {
    const color = COUNTRY_COLORS[dominantCountry] || '#3B9EFF';
    const size = Math.min(52, 26 + Math.log2(count) * 6);
    return `<div style="
      width: ${size}px; height: ${size}px;
      background: ${color}E0;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 3px ${color}40, 0 2px 8px rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 13px;
      cursor: pointer; user-select: none;
    ">${count}</div>`;
  }

  function showClusterList(clusterData, position) {
    // clusterData 是 [{lnglat, weight, ...}] 数据点数组（v2.0 文档格式）
    // 我们在原始 point 上塞了 newsId，所以这里反查 NEWS_DATA
    const newsList = clusterData.map(d => {
      const id = d.newsId != null ? d.newsId : (d.data && d.data.newsId);
      return id != null ? NEWS_DATA.find(x => String(x.id) === String(id)) : null;
    }).filter(Boolean);

    const html = `
      <div class="info-card" style="width: 360px;">
        <div class="info-card-head">
          <div class="info-card-meta">
            <span style="font-weight:600;color:var(--text-primary);">${newsList[0]?.city || ''}</span>
            <span style="color:var(--text-secondary);">· ${newsList.length} 条新闻</span>
          </div>
        </div>
        <div style="max-height:420px;overflow-y:auto;">
          ${newsList.map(n => {
            const persp = n.perspective || 'local';
            const perspLabel = PERSPECTIVE_LABEL[persp] || persp;
            return `
              <div class="news-item" data-cluster-id="${n.id}" style="border-bottom:1px solid var(--border);cursor:pointer;">
                <div class="news-item-meta">
                  <span class="country-badge ${n.country.toLowerCase()}">${n.country}</span>
                  <span class="perspective-badge ${persp}">${perspLabel}</span>
                  <span class="news-item-time">${timeAgo(n.published_at)}</span>
                </div>
                <div class="news-item-title">${n.title_zh}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
    infoWindow.setContent(html);
    infoWindow.open(map, position);
    // 给列表项绑定点击事件，切到单条详情
    setTimeout(() => {
      document.querySelectorAll('.amap-info-content [data-cluster-id]').forEach(el => {
        el.addEventListener('click', () => focusNews(el.dataset.clusterId));
      });
    }, 50);
  }

  function renderMarkers(items) {
    // 清掉旧 clusterer
    if (clusterer) {
      clusterer.setMap(null);
      clusterer = null;
    }
    // 清掉降级模式下直接 add 上去的 marker
    Object.values(markerMap).forEach(m => map.remove(m));
    Object.keys(markerMap).forEach(k => delete markerMap[k]);

    if (items.length === 0) return;

    // v2.0 文档格式：[{lnglat:[lng,lat], weight:1, ...自定义字段}]
    const points = items.map(n => ({
      lnglat: [n.lng, n.lat],
      weight: 1,
      newsId: n.id,
      country: n.country,
      perspective: n.perspective
    }));

    if (typeof AMap.MarkerCluster === 'function') {
      try {
        clusterer = new AMap.MarkerCluster(map, points, {
          gridSize: 60,
          maxZoom: 11,
          // 单点渲染：用我们原来的 country 颜色 + perspective 区分
          renderMarker: function(ctx) {
            const data = ctx.data && ctx.data[0];
            const country = data ? data.country : 'KZ';
            const perspective = data ? data.perspective : 'local';
            const newsId = data ? data.newsId : null;
            ctx.marker.setContent(makeMarkerContent(country, perspective));
            ctx.marker.setAnchor('center');
            ctx.marker.setOffset(new AMap.Pixel(0, 0));
            ctx.marker.setExtData({ newsId });
          },
          // 聚合点渲染：count + 主导国家颜色
          renderClusterMarker: function(ctx) {
            const countryCount = {};
            (ctx.clusterData || []).forEach(d => {
              if (d.country) countryCount[d.country] = (countryCount[d.country] || 0) + 1;
            });
            let dominant = 'KZ';
            let mx = 0;
            for (const c in countryCount) {
              if (countryCount[c] > mx) { mx = countryCount[c]; dominant = c; }
            }
            ctx.marker.setContent(makeClusterContent(ctx.count, dominant));
            ctx.marker.setAnchor('center');
            ctx.marker.setOffset(new AMap.Pixel(0, 0));
          }
        });

        // 单点点击：跳到详情
        clusterer.on('click', (ev) => {
          if (!ev.clusterData) return;
          if (ev.clusterData.length === 1) {
            const d = ev.clusterData[0];
            if (d.newsId != null) focusNews(d.newsId);
          } else if (ev.clusterData.length > 1) {
            // 多条：弹出列表 InfoWindow
            showClusterList(ev.clusterData, ev.lnglat);
          }
        });

        console.log(`[cluster] 创建成功，${points.length} 个数据点进入聚合器`);
      } catch (e) {
        console.error('MarkerCluster 初始化失败，降级到单点:', e);
        clusterer = null;
        renderMarkersFallback(items);
      }
    } else {
      console.warn('AMap.MarkerCluster 未加载，降级到单点');
      renderMarkersFallback(items);
    }
  }

  function renderMarkersFallback(items) {
    items.forEach(n => {
      const marker = new AMap.Marker({
        position: [n.lng, n.lat],
        content: makeMarkerContent(n.country, n.perspective),
        anchor: 'center',
        offset: new AMap.Pixel(0, 0)
      });
      marker.on('click', () => focusNews(n.id));
      markerMap[n.id] = marker;
      map.add(marker);
    });
  }

  function focusNews(id) {
    const news = NEWS_DATA.find(n => String(n.id) === String(id));
    if (!news) return;
    activeId = news.id;
    map.setZoomAndCenter(7, [news.lng, news.lat], false, 400);
    infoWindow.setContent(makeInfoCard(news));
    infoWindow.open(map, [news.lng, news.lat]);
    document.querySelectorAll('.news-item').forEach(el => {
      el.classList.toggle('active', String(el.dataset.id) === String(news.id));
    });
    const activeEl = document.querySelector(`.news-item[data-id="${id}"]`);
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function applyFilter() {
    let items = NEWS_DATA;
    if (currentFilter !== 'ALL') {
      items = items.filter(n => n.country === currentFilter);
    }
    if (currentPerspective !== 'ALL') {
      items = items.filter(n => (n.perspective || 'local') === currentPerspective);
    }
    renderList(items);
    renderMarkers(items);
  }

  // ====== 初始化 ======
  function initMap() {
    map = new AMap.Map('map', {
      center: [68, 43],
      zoom: 5,
      mapStyle: 'amap://styles/dark',
      viewMode: '2D',
      features: ['bg', 'road', 'building', 'point']
    });
    infoWindow = new AMap.InfoWindow({
      isCustom: true,
      offset: new AMap.Pixel(0, -16),
      autoMove: true
    });
    map.on('click', () => infoWindow.close());
  }

  async function loadNews() {
    try {
      const base = window.APP_CONFIG.API_BASE || '';
      const resp = await fetch(base + '/api/news?days=7&limit=500');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      NEWS_DATA = data.items.map(n => ({
        id: n.id,
        country: n.country,
        city: n.city,
        lat: n.lat,
        lng: n.lng,
        title_zh: n.title_zh,
        summary_zh: n.summary_zh,
        source: n.source_name,
        source_url: n.source_url,
        published_at: n.published_at,
        perspective: n.perspective || 'local'
      }));
      const updateEl = document.getElementById('updateInfo');
      if (updateEl) updateEl.textContent = '🔄 共 ' + NEWS_DATA.length + ' 条新闻';
    } catch (e) {
      console.error('加载新闻失败:', e);
      const updateEl = document.getElementById('updateInfo');
      if (updateEl) updateEl.textContent = '⚠ 加载失败：' + e.message;
      NEWS_DATA = [];
    }
  }

  async function waitForAMap(timeout = 8000) {
    const start = Date.now();
    while (typeof AMap === 'undefined') {
      if (Date.now() - start > timeout) return false;
      await new Promise(r => setTimeout(r, 100));
    }
    return true;
  }

  function loadPlugin(name) {
    return new Promise(resolve => {
      AMap.plugin([name], () => resolve(true));
      // 5 秒超时兜底，没加载成功也别卡死
      setTimeout(() => resolve(false), 5000);
    });
  }

  async function init() {
    const ok = await waitForAMap();
    if (!ok) {
      document.getElementById('loadingOverlay').innerHTML = `
        <div style="color: var(--text-secondary); text-align: center;">
          <div style="font-size: 32px; margin-bottom: 12px;">🗺</div>
          <div>地图加载失败</div>
          <div style="font-size: 12px; margin-top: 8px;">请检查高德 API Key 配置或网络</div>
        </div>`;
      return;
    }
    initMap();
    // 异步加载 MarkerCluster 插件（v2.0 推荐方式）
    await loadPlugin('AMap.MarkerCluster');
    await loadNews();
    applyFilter();
    document.getElementById('loadingOverlay').classList.add('hidden');
  }

  // ====== 事件绑定 ======
  document.getElementById('countryFilter').addEventListener('click', e => {
    const chip = e.target.closest('.country-chip');
    if (!chip || !chip.dataset.country) return;
    e.currentTarget.querySelectorAll('.country-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.country;
    activeId = null;
    infoWindow && infoWindow.close();
    applyFilter();
  });

  document.getElementById('perspectiveFilter').addEventListener('click', e => {
    const chip = e.target.closest('.country-chip');
    if (!chip || !chip.dataset.perspective) return;
    e.currentTarget.querySelectorAll('.country-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentPerspective = chip.dataset.perspective;
    activeId = null;
    infoWindow && infoWindow.close();
    applyFilter();
  });

  document.getElementById('aboutBtn').addEventListener('click', () => {
    document.getElementById('aboutModal').classList.add('show');
  });
  document.getElementById('aboutClose').addEventListener('click', () => {
    document.getElementById('aboutModal').classList.remove('show');
  });
  document.getElementById('aboutModal').addEventListener('click', e => {
    if (e.target.id === 'aboutModal') {
      document.getElementById('aboutModal').classList.remove('show');
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.getElementById('aboutModal').classList.remove('show');
      infoWindow && infoWindow.close();
    }
  });

  // 启动
  window.addEventListener('load', init);
</script>

</body>
</html>
